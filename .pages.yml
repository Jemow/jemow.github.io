# Pages CMS configuration for roicort.github.io/dasein
# More on: https://pagescms.org/docs/configuration/

media:
  - name: assets
    label: Assets
    input: src/assets
    output: ../../assets
    # Show both images and common document types in the media browser
    categories: [image, document]

content:
  # Projects
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    # files will be created with a date + title-based filename
    filename: "{primary}.md"
    format: yaml-frontmatter
    subfolders: false
    view:
      fields: [title, pubDate]
      primary: title
      sort: [pubDate, title]
      default:
        search: ""
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: pubDate
        label: Publish date
        type: date
        required: true

      - name: updatedDate
        label: Updated date
        type: date

      - name: heroImage
        label: Hero image
        type: image

      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Game Jams, Academic, Personal]

      - name: engine
        label: Engine
        type: string

      - name: tags
        label: Tags
        type: string
        list: true

      - name: featured
        label: Featured on home page (1, 2 or 3)
        type: number

      # 'body' is reserved and will map to the Markdown content (frontmatter + body)
      - name: body
        label: Content
        type: rich-text

  # Site data (JSON files read by the home page sections)
  - name: home
    label: Profile & socials
    type: file
    path: src/data/home.json
    format: json

  - name: career
    label: Career / Education
    type: file
    path: src/data/career.json
    format: json

  - name: skills
    label: Skills
    type: file
    path: src/data/tech.json
    format: json

settings:
  # When saving, merge submitted fields with existing file content instead of overwriting
  content:
    merge: true
